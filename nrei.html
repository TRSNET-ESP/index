<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRSNET - Nodo Reinosa WakeLock</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #00ffcc;
            font-family: monospace;
            text-align: center;
            padding-top: 40px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: auto;
            background: #111827;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #1f2937;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 { margin-bottom: 5px; color: #ffffff; }
        .sub { font-size: 12px; color: #9ca3af; margin-bottom: 20px; }
        #status {
            font-size: 14px;
            padding: 10px;
            border-radius: 6px;
            background: #1f2937;
            margin-bottom: 20px;
        }
        audio {
            width: 100%;
            outline: none;
        }
        .logs {
            margin-top: 15px;
            font-size: 10px;
            color: #6b7280;
            text-align: left;
            height: 90px;
            overflow-y: hidden;
            background: #030712;
            padding: 8px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>TRSNET REINOSA</h2>
        <div class="sub">Nodo WakeLock & 30m Refresh</div>
        
        <div id="status" style="color: #fbbf24;">Iniciando sistema...</div>
        
        <audio id="stream" controls autoplay></audio>

        <div class="logs" id="logBox">Esperando inicio...</div>
    </div>

    <script>
        const audio = document.getElementById('stream');
        const statusText = document.getElementById('status');
        const logBox = document.getElementById('logBox');

        const streamUrl = 'http://100.99.98.47:8090'; 
        let reintentoTimer = null;
        let watchdogTimer = null;
        let refreshTimer = null;
        let fallosConsecutivos = 0; 
        let wakeLock = null;

        function log(msg) {
            const hora = new Date().toLocaleTimeString();
            logBox.innerHTML = `[${hora}] ${msg}<br>` + logBox.innerHTML;
        }

        // PETICIÓN DE WAKE LOCK (Evita que el móvil apague la pantalla o duerma la CPU)
        async function solicitarWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                    log("WakeLock activo: Pantalla bloqueada contra apagado.");
                    
                    // Si el usuario cambia de app y vuelve, se libera; lo reintentamos pedir
                    wakeLock.addEventListener('release', () => {
                        log("WakeLock liberado por el sistema. Reintentando...");
                        setTimeout(solicitarWakeLock, 3000);
                    });
                } catch (err) {
                    log("Error al activar WakeLock: " + err.name);
                }
            } else {
                log("WakeLock no soportado en este navegador.");
            }
        }

        function conectarStream() {
            if (reintentoTimer) clearTimeout(reintentoTimer);

            statusText.innerText = "Conectando al estudio...";
            statusText.style.color = "#fbbf24";
            
            audio.pause();
            audio.src = streamUrl + "?nocache=" + Date.now();
            audio.load();
            
            audio.play().then(() => {
                statusText.innerText = "EN DIRECTO (Reproduciendo)";
                statusText.style.color = "#00ffcc";
                fallosConsecutivos = 0; 
                log("Flujo conectado por Tailscale.");
                
                // Asegurar el WakeLock al reproducir
                solicitarWakeLock();
            }).catch(e => {
                fallosConsecutivos++;
                statusText.innerText = "Sin señal (" + fallosConsecutivos + "/4)...";
                statusText.style.color = "#ef4444";
                log(`Fallo de red (${fallosConsecutivos}). Reintento en 5s...`);

                if (fallosConsecutivos >= 4) {
                    log("¡Demasiados fallos! Reiniciando la página web completa...");
                    setTimeout(() => {
                        location.reload(true);
                    }, 2000);
                    return;
                }

                reintentoTimer = setTimeout(conectarStream, 5000);
            });
        }

        audio.onerror = function() {
            fallosConsecutivos++;
            statusText.innerText = "Corte de enlace detectado";
            statusText.style.color = "#ef4444";
            log(`Error de socket. Fallo #${fallosConsecutivos}`);
            
            if (fallosConsecutivos >= 4) {
                log("Reiniciando la web por corte de socket...");
                setTimeout(() => location.reload(true), 2000);
                return;
            }

            if (reintentoTimer) clearTimeout(reintentoTimer);
            reintentoTimer = setTimeout(conectarStream, 5000);
        };

        audio.onpause = function() {
            if (!audio.ended && audio.currentTime > 0) {
                log("Audio congelado. Forzando rearme...");
                if (reintentoTimer) clearTimeout(reintentoTimer);
                reintentoTimer = setTimeout(conectarStream, 3000);
            }
        };

        // WATCHDOG DE SEGURIDAD (Comprobación cada 12 segundos)
        function iniciarWatchdog() {
            if (watchdogTimer) clearInterval(watchdogTimer);
            watchdogTimer = setInterval(() => {
                if (audio.paused && !audio.ended) {
                    log("Watchdog: Detectado bloqueo. Forzando reconexión...");
                    conectarStream();
                }
            }, 12000);
        }

        // TEMPORIZADOR PREVENTIVO DE 30 MINUTOS
        function iniciarTemporizadorRefresco() {
            if (refreshTimer) clearInterval(refreshTimer);
            refreshTimer = setInterval(() => {
                log("Mantenimiento preventivo: Refrescando emisión (30m)...");
                setTimeout(() => {
                    location.reload(true);
                }, 1000);
            }, 1800000);
        }

        window.onload = function() {
            log("Nodo HTML con WakeLock iniciado.");
            conectarStream();
            iniciarWatchdog();
            iniciarTemporizadorRefresco();
            solicitarWakeLock();
        };

        // Si la pestaña recupera visibilidad, reactivamos el bloqueo de pantalla
        document.addEventListener("visibilitychange", async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                await solicitarWakeLock();
            }
        });
    </script>

</body>
</html>
